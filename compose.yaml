services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-absen_ukm}
      DB_USER: ${POSTGRES_USER:-absen_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-absen_ukm}
      POSTGRES_USER: ${POSTGRES_USER:-absen_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_anggota_presensi.sql:/docker-entrypoint-initdb.d/01_anggota_presensi.sql:ro
      - ./sql/02_users.sql:/docker-entrypoint-initdb.d/02_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: